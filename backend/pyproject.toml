# Backend dependencies and tool configuration.
#
# Fully pinned for reproducible builds: each list is a complete transitive
# closure (pip freeze output), not just the direct requirements. To upgrade,
# edit the pins and rebuild. Regenerate with:
#   docker compose exec backend pip freeze
#
# Two lists, both installed into the container by the Dockerfile (tests and
# type checkers run inside the container too — see README):
#   - [project] dependencies: everything the running service needs. Direct
#     deps: alembic (migrations), fastapi, psycopg / psycopg-binary (driver),
#     pydantic, pydantic-settings, python-multipart (file uploads),
#     SQLAlchemy, uvicorn (plus its "standard" extras: httptools, PyYAML,
#     uvloop, watchfiles, websockets).
#   - [dependency-groups] dev: the dev profile — pytest and httpx2 (FastAPI
#     TestClient) for the test suite, mypy and basedpyright for static
#     type checking. Everything below those four in the list is pulled in
#     transitively.

[project]
name = "demobooru-backend"
version = "0.1.0"
description = "Demobooru image board demo - FastAPI/SQLAlchemy backend"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.19.1",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "click==8.4.2",
    "fastapi==0.141.1",
    "greenlet==3.5.5",
    "h11==0.16.0",
    "httptools==0.8.0",
    "idna==3.18",
    "Mako==1.4.1",
    "MarkupSafe==3.0.3",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pydantic_core==2.46.4",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "PyYAML==6.0.3",
    "SQLAlchemy==2.0.52",
    "starlette==1.6.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "uvicorn==0.52.3",
    "uvloop==0.22.1",
    "watchfiles==1.2.0",
    "websockets==17.0.1",
]

[dependency-groups]
dev = [
    "ast_serialize==0.8.0",
    "basedpyright==1.39.10",
    "httpcore2==2.10.0",
    "httpx2==2.10.0",
    "iniconfig==2.3.0",
    "librt==0.15.0",
    "mypy==2.3.1",
    "mypy_extensions==1.1.0",
    "nodejs-wheel-binaries==24.16.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "Pygments==2.20.0",
    "pytest==9.1.1",
    "truststore==0.10.4",
]

# Strict mypy over the whole backend: app, migrations (including generated
# revisions), and the test suite. The pydantic plugin understands BaseModel
# __init__ synthesis so model construction is checked against field types.
[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "alembic", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# basedpyright at its "recommended" level (its default, stricter than
# standard "basic") over the same file set; the two checkers complement
# each other. Autogenerated Alembic revisions are excluded (mypy still
# checks them); two recommended rules are opted out of below with reasons.
[tool.basedpyright]
include = ["app", "alembic", "tests"]
exclude = ["alembic/versions"]
pythonVersion = "3.14"
typeCheckingMode = "recommended"
# FastAPI's dependency injection is call-based by design (Depends / File /
# Form / Query inside parameter defaults); this rule cannot be satisfied.
reportCallInDefaultInitializer = false
# JSON response bodies are Any by nature; the tests assert on their
# structure, and annotating every body would add churn, not safety.
reportAny = false
