name: demobooru

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demobooru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demobooru_demo}
      POSTGRES_DB: ${POSTGRES_DB:-demobooru}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      # Postgres 18+ stores data in versioned subdirectories under
      # /var/lib/postgresql; the volume must mount at that level, not .../data.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demobooru} -d ${POSTGRES_DB:-demobooru}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-demobooru}:${POSTGRES_PASSWORD:-demobooru_demo}@database:5432/${POSTGRES_DB:-demobooru}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_TARGET: ${API_TARGET:-http://backend:8000}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    ports:
      - "${FRONTEND_HOST_PORT:-5174}:5174"
    volumes:
      - ./frontend:/app
      - front_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  front_node_modules:
